<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="720" height="370" fill="#FFFFFF"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#212529">Wio Terminal to Meshnology W12</text>
<text x="40" y="70" font-size="14" fill="#495057">Three wires. TX on one side goes to RX on the other. Both sides are 3.3 V.</text>
<rect x="40" y="104" width="200" height="188" rx="10" fill="#F8F9FA" stroke="#CED4DA"/>
<text x="56" y="128" font-size="14" font-weight="600" fill="#212529">Wio Terminal</text>
<rect x="470" y="104" width="210" height="188" rx="10" fill="#F8F9FA" stroke="#CED4DA"/>
<text x="486" y="128" font-size="14" font-weight="600" fill="#212529">Meshnology W12</text>
<circle cx="70" cy="150" r="11" fill="#7048E8"/>
<text x="70" y="154" font-size="10" font-weight="600" text-anchor="middle" fill="#FFFFFF">8</text>
<text x="92" y="155" font-size="14" font-weight="700" text-anchor="start" fill="#7048E8">pin 8 · TX</text>
<line x1="236" y1="150" x2="474" y2="150" stroke="#7048E8" stroke-width="4" stroke-linecap="round"/>
<circle cx="496" cy="150" r="7" fill="#7048E8"/>
<text x="514" y="155" font-size="14" font-weight="700" fill="#7048E8">GPIO 39</text>
<text x="666" y="155" font-size="12" text-anchor="end" fill="#6C757D">radio RX</text>
<circle cx="70" cy="198" r="11" fill="#1864AB"/>
<text x="70" y="202" font-size="10" font-weight="600" text-anchor="middle" fill="#FFFFFF">10</text>
<text x="92" y="203" font-size="14" font-weight="700" text-anchor="start" fill="#1864AB">pin 10 · RX</text>
<line x1="236" y1="198" x2="474" y2="198" stroke="#1864AB" stroke-width="4" stroke-linecap="round"/>
<circle cx="496" cy="198" r="7" fill="#1864AB"/>
<text x="514" y="203" font-size="14" font-weight="700" fill="#1864AB">GPIO 38</text>
<text x="666" y="203" font-size="12" text-anchor="end" fill="#6C757D">radio TX</text>
<circle cx="70" cy="246" r="11" fill="#3A3A3C"/>
<text x="70" y="250" font-size="10" font-weight="600" text-anchor="middle" fill="#FFFFFF">6</text>
<text x="92" y="251" font-size="14" font-weight="700" text-anchor="start" fill="#3A3A3C">pin 6 · GND</text>
<line x1="236" y1="246" x2="474" y2="246" stroke="#3A3A3C" stroke-width="4" stroke-linecap="round"/>
<circle cx="496" cy="246" r="7" fill="#3A3A3C"/>
<text x="514" y="251" font-size="14" font-weight="700" fill="#3A3A3C">GND</text>
<text x="56" y="282" font-size="12" fill="#6C757D">40-pin header</text>
<text x="486" y="282" font-size="12" fill="#6C757D">GNSS header (unpopulated)</text>
<text x="40" y="326" font-size="13" fill="#495057">Radio setting: serial module on, mode PROTO, 19200 baud, rxd 39, txd 38.</text>
<text x="40" y="350" font-size="13" fill="#495057">GPIO 17 and 18 drive the screen on the W12, so use the GNSS header.</text>
</svg>
