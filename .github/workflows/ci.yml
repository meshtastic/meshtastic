name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check for JS/TS file changes
        id: js-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            js:
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.mjs'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.jsx'

      - name: Run oxlint
        if: steps.js-filter.outputs.js == 'true'
        uses: oxc-project/oxlint-action@v3.1.0
        with:
          config: .oxlintrc.json
          deny-warnings: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm run format
        continue-on-error: true

      # Not present on the stock ubuntu runner image, and lint:mdx needs it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint MDX files
        run: pnpm run lint:mdx
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Dependencies
        run: pnpm install

      - name: Build Package
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  frozen-docs:
    # Cutting a release is all additions, so it passes. Editing or removing an
    # existing snapshot fails. The version-cut label is an explicit override for
    # the rare deliberate correction to archived docs.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'version-cut')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for frozen documentation changes
        id: frozen
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frozen:
              - modified|deleted|renamed: 'versioned_docs/**'
              - modified|deleted|renamed: 'versioned_sidebars/**'

      - name: Fail if frozen documentation was modified
        if: steps.frozen.outputs.frozen == 'true'
        run: |
          echo "::error::Archived documentation is read-only."
          echo "versioned_docs/ and versioned_sidebars/ are frozen snapshots of released"
          echo "firmware documentation. Edit docs/ instead - it becomes the next release."
          exit 1

  hardware-card:
    # The share card at static/img/preview/ is generated from devices.json by
    # `pnpm preview:hardware`. CI does not regenerate it: the vendored fonts make
    # the typeface reproducible, but Chromium still rasterises text differently
    # across operating systems, so comparing a Linux render against a committed
    # macOS one would fail on pixels rather than on content. Checking that the two
    # changed together catches the mistake that actually happens.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter reads the pull request's file list on pull_request events.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for device list changes
        id: card-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            devices:
              - 'src/data/devices.json'
            card:
              - 'static/img/preview/hardware-1200x630.png'

      - name: Regenerate the card when the device list changes
        if: steps.card-filter.outputs.devices == 'true' && steps.card-filter.outputs.card != 'true'
        run: |
          echo "::error file=src/data/devices.json::The device list changed but the share card did not."
          echo "src/data/devices.json changed without static/img/preview/hardware-1200x630.png."
          echo "The card is generated from that file, so it is now out of date."
          echo ""
          echo "  pnpm exec playwright install chromium   # one-time"
          echo "  pnpm preview:hardware"
          echo ""
          echo "Then commit the regenerated PNG alongside your devices.json change."
          echo "See scripts/README-hardware-preview.md."
          exit 1
