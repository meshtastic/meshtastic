name: Generated Docs Guard

# The Android and Apple software docs — and the screenshots they reference — are
# generated by the client apps and synced into this repo by the sync-android-docs /
# sync-apple-docs workflows. Editing them here is always wrong: the next sync
# silently reverts the change. This guard fails the PR and explains where the edit
# belongs.
#
# Runs on every PR (no `paths:` filter) so the check always reports a status —
# with a paths filter, a PR that dropped the offending files would never re-run
# and would keep a stale red check forever.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  generated-docs-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check for hand edits to generated app docs
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prAuthor = pr.user.login;

            // Paths written by the sync workflows. The image directories are the
            // scripts' DEST_IMAGES_DIR, which they prune — anything hand-added there
            // is deleted by the next sync, so the whole prefix is sync-owned.
            // Android images are scoped to docs/ because static/img/android/ may hold
            // hand-maintained images outside the synced set.
            // Add versioned_docs/*/software/{android,apple}/ here too if the frozen
            // snapshots should be guarded as well.
            const GUARDED = [
              {
                platform: "Android",
                prefixes: ["docs/software/android/", "static/img/android/docs/"],
                sourceRepo: "meshtastic/Meshtastic-Android",
                syncWorkflow: "sync-android-docs.yml",
              },
              {
                platform: "Apple",
                prefixes: ["docs/software/apple/", "static/img/apple/"],
                sourceRepo: "meshtastic/Meshtastic-Apple",
                syncWorkflow: "sync-apple-docs.yml",
              },
            ];

            // The sync PRs opened by the sync-*-docs workflows are the one legitimate
            // way these files change. They are branches on this repo pushed by the
            // Actions bot, so a fork PR can never impersonate them.
            const SYNC_BRANCHES = new Set(["sync/android-docs", "sync/apple-docs"]);
            const SYNC_ACTORS = new Set(["github-actions[bot]", "meshtastic-bot"]);
            // Escape hatch for maintainers (e.g. a one-off revert or a sync-script fix
            // that has to land alongside its output).
            const OVERRIDE_LABEL = "allow-generated-docs-edit";

            const COMMENT_ID = "<!-- generated-docs-guard -->";

            const sameRepo = pr.head.repo?.full_name === pr.base.repo.full_name;
            const isSyncPr =
              sameRepo &&
              SYNC_BRANCHES.has(pr.head.ref) &&
              SYNC_ACTORS.has(prAuthor);

            if (isSyncPr) {
              core.info(`Skipping: ${pr.head.ref} is an automated docs sync PR.`);
              return;
            }

            const labels = (pr.labels || []).map((l) => l.name);
            const overridden = labels.includes(OVERRIDE_LABEL);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const hits = new Map(); // platform -> { info, files: [] }
            for (const file of files) {
              const match = GUARDED.find((g) =>
                g.prefixes.some((p) => file.filename.startsWith(p))
              );
              if (!match) continue;
              if (!hits.has(match.platform)) {
                hits.set(match.platform, { info: match, files: [] });
              }
              hits.get(match.platform).files.push(file);
            }

            // Find any previous comment from this guard so we update in place rather
            // than adding a new one on every push.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(COMMENT_ID)
            );

            const upsert = async (body) => {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                });
              }
            };

            if (hits.size === 0) {
              core.info("No changes to generated app docs.");
              if (existing) {
                await upsert(
                  `${COMMENT_ID}\n### ✅ Generated app docs check\n\n` +
                    `This PR no longer changes any generated Android or Apple app documentation. Thanks!\n`
                );
              }
              return;
            }

            const statusWord = (status) =>
              status === "added"
                ? "added"
                : status === "removed"
                  ? "deleted"
                  : status === "renamed"
                    ? "renamed"
                    : "modified";

            let body = `${COMMENT_ID}\n### 🤖 These app docs are auto-generated\n\n`;
            body += `Hey @${prAuthor}! Thanks for the contribution. `;
            body += `This PR changes documentation or screenshots that are **generated by the client apps** and synced into this repo automatically, `;
            body += `so edits made here are overwritten the next time the sync runs.\n\n`;

            for (const { info, files: changed } of hits.values()) {
              const prefixList = info.prefixes.map((p) => `\`${p}\``).join(", ");
              body += `#### ${info.platform} — ${prefixList}\n\n`;
              body += `Source of truth: [${info.sourceRepo}](https://github.com/${info.sourceRepo}) `;
              body += `· synced by [\`${info.syncWorkflow}\`](https://github.com/${owner}/${repo}/blob/master/.github/workflows/${info.syncWorkflow})\n\n`;
              for (const f of changed.slice(0, 25)) {
                body += `- \`${f.filename}\` (${statusWord(f.status)})\n`;
              }
              if (changed.length > 25) {
                body += `- …and ${changed.length - 25} more\n`;
              }
              body += `\n`;
            }

            body += `**What to do instead:** please open your pull request against the app repository listed above. `;
            body += `Once it is merged and included in an app release, the weekly sync workflow will bring the change into these docs for you.\n\n`;
            body += `Please revert the changes to the paths listed above so this check can pass. `;
            body += `Any other changes in this PR are unaffected.\n\n`;

            if (overridden) {
              body += `> ⚠️ A maintainer applied the \`${OVERRIDE_LABEL}\` label, so this check is **not blocking** for this PR.\n\n`;
            } else {
              body += `> Maintainers: if this edit is intentional (a revert, or a sync-script change that must land with its output), `;
              body += `apply the \`${OVERRIDE_LABEL}\` label to bypass this check.\n\n`;
            }

            body += `---\n*Automated check — see [\`generated-docs-guard.yml\`](https://github.com/${owner}/${repo}/blob/master/.github/workflows/generated-docs-guard.yml).*`;

            await upsert(body);

            const total = [...hits.values()].reduce((n, h) => n + h.files.length, 0);
            const summary = `${total} generated app doc file(s) changed in: ${[...hits.keys()].join(", ")}`;

            if (overridden) {
              core.warning(`${summary} — allowed by the ${OVERRIDE_LABEL} label.`);
              return;
            }

            core.setFailed(
              `${summary}. These files are auto-generated by the client apps; ` +
                `submit the change to the app repository instead.`
            );
