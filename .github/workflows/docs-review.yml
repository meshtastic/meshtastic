name: Docs Review

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - "docs/**"
      - "blog/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-review:
    runs-on: ubuntu-latest
    steps:
      - name: Review docs changes
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;

            // Get the list of changed files
            // Paginate: listFiles returns 100 per page, and a single page
            // silently drops every file past the first hundred.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const suggestions = [];
            const praises = [];
            let hasBlogChanges = false;
            let hasDocsChanges = false;

            for (const file of files) {
              const filename = file.filename;
              const patch = file.patch || "";

              // Frozen version snapshots are mechanical copies of docs/ made by
              // `docusaurus docs:version`, and they follow their own rules: MDX
              // partials must be imported relative to the snapshot (or via
              // @site/versioned_docs/...), never @site/docs/, or an archived
              // page renders the live partial. Nobody hand-edits these files, so
              // contributor advice on them is noise at best and wrong at worst.
              if (
                filename.startsWith("versioned_docs/") ||
                filename.startsWith("versioned_sidebars/")
              ) {
                continue;
              }

              // Track what kind of changes we have
              if (filename.startsWith("blog/")) hasBlogChanges = true;
              if (filename.startsWith("docs/")) hasDocsChanges = true;

              // Check for non-webp images being added
              if (
                file.status === "added" &&
                /\.(png|jpg|jpeg|gif)$/i.test(filename) &&
                !filename.includes("meshtastic_logo")
              ) {
                suggestions.push(
                  `📸 **${filename}** — Could you convert this to \`.webp\`? We try to keep images in webp format to reduce file sizes. Thanks!`
                );
              }

              // Check for images in wrong directories
              if (
                file.status === "added" &&
                /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(filename) &&
                !filename.startsWith("static/") &&
                !filename.startsWith(".github/")
              ) {
                suggestions.push(
                  `📁 **${filename}** — Looks like this image might belong in the \`static/img/\` directory. Could you move it there? Linking would then be \`/img/${filename.split("/").pop()}\`.`
                );
              }

              // Check blog posts for missing frontmatter image field
              if (
                filename.startsWith("blog/") &&
                filename.endsWith(".mdx") &&
                file.status === "added"
              ) {
                if (patch && !patch.includes("image:")) {
                  suggestions.push(
                    `🖼️ **${filename}** — This blog post looks like it's missing an \`image\` field in the frontmatter for social media previews. Stupidly the preview image has to be a PNG — for some reason it never works with webp. Also for the best experience the preview image should be 1200 x 630.`
                  );
                }
              }

              // Check for relative import paths introduced by this change.
              // Only added lines count. Testing the whole patch matched the
              // removed line too, so converting an import to the alias tripped
              // the check on the very change that fixed it.
              if (filename.endsWith(".mdx") && patch) {
                const hasRelativeImport = patch
                  .split("\n")
                  .filter((l) => l.startsWith("+") && !l.startsWith("+++"))
                  .some((l) => /from\s+["'](\/src\/|\.\.\/)/.test(l));

                if (hasRelativeImport) {
                  suggestions.push(
                    `🔗 **${filename}** — Looks like this uses a relative import path. Could you use the \`@site/src/\` alias instead? It's the canonical Docusaurus alias and is more explicit about the import source.`
                  );
                }
              }

              // Check for large video files without preload hints
              if (filename.endsWith(".mdx") && patch) {
                if (
                  patch.includes("<video") &&
                  !patch.includes('preload="metadata"') &&
                  !patch.includes('preload="none"')
                ) {
                  suggestions.push(
                    `🎬 **${filename}** — The video embed could benefit from \`preload="metadata"\` to avoid unnecessary bandwidth usage, especially on mobile.`
                  );
                }
              }

              // Check product and technology name casing in prose (11.4).
              // The patch only identifies which lines were added; fence state
              // is read from the head file, because a hunk can begin inside a
              // fence with the opening marker outside the patch entirely.
              if (/\.mdx?$/.test(filename) && patch && file.status !== "removed") {
                const NOT_BEFORE = "(?<![.\\w/-])";
                // Reject a dotted key such as bluetooth.enabled, but not a
                // term that simply ends a sentence.
                const NOT_AFTER = "(?![\\w-])(?!\\.\\w)";
                const CASING = [
                  // "Lora V3.0" and "Lora 32" are vendor product names, which
                  // 11.4 exempts, so a version or model number is skipped.
                  ["Lora(?!\\s+[Vv]?\\d)|LORA|lora", "LoRa"],
                  ["Lorawan|LoraWAN", "LoRaWAN"],
                  ["NRF52840|nrf52840", "nRF52840"],
                  ["ESP32S3|esp32s3", "ESP32-S3"],
                  ["WiFi|wifi|WIFI", "Wi-Fi"],
                  ["Node-red|node-red", "Node-RED"],
                  ["bluetooth", "Bluetooth"],
                  ["mqtt|Mqtt", "MQTT"],
                  ["Meshtasticd|MeshtasticD", "meshtasticd"],
                  ["gps|Gps", "GPS"],
                ].map(([alts, correct]) => [
                  new RegExp(NOT_BEFORE + "(?:" + alts + ")" + NOT_AFTER, "g"),
                  correct,
                ]);

                // Line numbers in the head file that this patch adds.
                const addedLines = new Set();
                let newLine = null;
                for (const raw of patch.split("\n")) {
                  const hunk = raw.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                  if (hunk) {
                    newLine = Number(hunk[1]);
                  } else if (newLine === null || raw.startsWith("\\ No newline")) {
                    continue;
                  } else if (raw.startsWith("+")) {
                    addedLines.add(newLine++);
                  } else if (raw.startsWith(" ")) {
                    newLine++;
                  }
                  // Removed lines do not advance the new-file line number.
                }

                let contents = "";
                if (addedLines.size > 0) {
                  try {
                    const { data: blob } = await github.rest.git.getBlob({
                      owner,
                      repo,
                      file_sha: file.sha,
                    });
                    contents = Buffer.from(
                      blob.content.replace(/\n/g, ""),
                      "base64"
                    )
                      .toString("utf8")
                      .replace(/\r\n/g, "\n");
                  } catch (error) {
                    core.warning(
                      `Could not read ${filename} for the casing check: ${error.message}`
                    );
                  }
                }

                const blankOut = (match) => " ".repeat(match.length);
                const found = new Map();
                let fence = null;
                let frontMatter = false;
                let braceDepth = 0;
                let openTag = false;

                const lines = contents ? contents.split("\n") : [];
                for (const [index, line] of lines.entries()) {
                  // Front matter is metadata: id and slug are lowercase by design.
                  if (index === 0 && line.trim() === "---") {
                    frontMatter = true;
                    continue;
                  }
                  if (frontMatter) {
                    if (line.trim() === "---") frontMatter = false;
                    continue;
                  }

                  const marker = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
                  if (marker) {
                    const run = marker[1];
                    const trailing = marker[2];
                    if (!fence) {
                      // A backtick fence info string cannot contain a backtick.
                      if (run[0] !== "`" || !trailing.includes("`")) {
                        fence = { character: run[0], length: run.length };
                      }
                    } else if (
                      run[0] === fence.character &&
                      run.length >= fence.length &&
                      /^[ \t]*$/.test(trailing)
                    ) {
                      fence = null;
                    }
                    continue;
                  }
                  if (fence) continue;

                  // Reference link definitions and import lines are paths.
                  if (/^\s{0,3}\[[^\]]+\]:\s*\S+/.test(line)) continue;
                  if (/^\s*(?:import|export)\s/.test(line)) continue;

                  // Mask what is not prose. Code spans first, so a URL or tag
                  // inside backticks is already gone.
                  let prose = line
                    .replace(/(`+)((?:(?!\1)[\s\S])*)\1/g, blankOut)
                    .replace(/https?:\/\/\S+/g, blankOut)
                    .replace(/\]\([^)]*\)/g, blankOut)
                    .replace(/<[^>]*>/g, blankOut);

                  // JSX expressions such as values={[{label: "..."}]} span lines
                  // and hold JavaScript, not prose.
                  const wasInExpression = braceDepth > 0;
                  for (const character of prose) {
                    if (character === "{") braceDepth++;
                    else if (character === "}" && braceDepth > 0) braceDepth--;
                  }
                  if (wasInExpression || braceDepth > 0) continue;

                  // A tag broken over several lines is not prose either.
                  if (openTag) {
                    const close = prose.indexOf(">");
                    if (close === -1) continue;
                    prose = " ".repeat(close + 1) + prose.slice(close + 1);
                    openTag = false;
                  }
                  const lastOpen = prose.lastIndexOf("<");
                  if (lastOpen !== -1 && prose.indexOf(">", lastOpen) === -1) {
                    prose = prose.slice(0, lastOpen);
                    openTag = true;
                  }

                  if (!addedLines.has(index + 1)) continue;

                  // Key by the wrong spelling, so two wrong forms of the same
                  // word are both reported.
                  for (const [pattern, correct] of CASING) {
                    const hits = prose.match(pattern);
                    if (hits) for (const wrong of hits) found.set(wrong, correct);
                  }
                }

                if (found.size > 0) {
                  const list = [...found]
                    .map(([wrong, correct]) => `\`${wrong}\` → \`${correct}\``)
                    .join(", ");
                  suggestions.push(
                    `🔤 **${filename}** — Product name casing: ${list}. These are the official forms in design standard 11.4, and mixed casing across pages makes search and translation unreliable. Code, config keys, file paths, URLs and a vendor's own product names keep their own spelling.`
                  );
                }
              }

              // Added lines only, so removing an @site import is not praised.
              if (
                filename.endsWith(".mdx") &&
                patch &&
                patch
                  .split("\n")
                  .some(
                    (l) =>
                      l.startsWith("+") &&
                      !l.startsWith("+++") &&
                      l.includes("@site/")
                  )
              ) {
                praises.push(
                  `Using the \`@site/\` import alias in **${filename}**`
                );
              }
              if (
                file.status === "added" &&
                filename.endsWith(".webp")
              ) {
                praises.push(
                  `Image already in webp format — **${filename}**`
                );
              }
            }

            // Build the review comment
            let body = `### 🤖 Docs Review\n\n`;
            body += `Hey @${prAuthor}! Thanks for the ${hasBlogChanges ? "blog post" : "docs"} contribution! Here's a quick review:\n\n`;

            if (suggestions.length === 0) {
              body += `Looks good! `;
              if (hasBlogChanges) {
                body += `Nice blog post. `;
              }
              if (hasDocsChanges) {
                body += `Thanks for helping improve the docs. `;
              }
              body += `👍\n`;
            }

            if (praises.length > 0) {
              body += `**Nice work on:**\n`;
              for (const praise of praises) {
                body += `- ✅ ${praise}\n`;
              }
              body += `\n`;
            }

            if (suggestions.length > 0) {
              body += `**A few things to check:**\n\n`;
              for (const suggestion of suggestions) {
                body += `${suggestion}\n\n`;
              }
              body += `No rush — just some things that would help keep the docs consistent. Let me know if you have any questions!\n`;
            }

            body += `\n---\n*This is an automated review based on docs contribution guidelines.*`;

            // Post or update the review comment
            const botCommentIdentifier =
              "### 🤖 Docs Review";

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(
              (c) =>
                c.body && c.body.startsWith(botCommentIdentifier)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              console.log("Updated existing review comment");
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              console.log("Created new review comment");
            }
